spring.application.name=Paygenix

spring.config.import=optional:file:.env[.properties]

app.name=${APP_NAME}
app.base-url=${APP_BASE_URL}
app.web-url=${APP_WEB_URL}
# where the browser lands after Google sign-in (/oauth2/callback?code=... or ?error=...)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# browser origins allowed to call the API (comma-separated, exact match)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
# API docs are off unless explicitly enabled (local dev)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

server.port=${SERVER_PORT:8000}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Row-lock waits give up after 3s (the request answers 409 RESOURCE_BUSY). Hibernate 7 ignores
# jakarta.persistence.lock.timeout on PostgreSQL, so it is set per connection.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '3s'
# Session-level setting: lost behind a transaction-mode pooler (PgBouncer); use ALTER ROLE ... SET there.
# Waiting for a free connection is bounded too, so a full pool fails fast instead of hanging for 30s.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
# Migrations may wait longer for table locks than requests do.
spring.flyway.init-sqls=SET lock_timeout = '30s'

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}

logging.level.org.springframework.security=INFO

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
# seconds; a session ends this long after sign-in even if it keeps refreshing (default 30 days)
jwt.session-max-lifetime=${JWT_SESSION_MAX_LIFETIME:2592000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket.st=stories
minio.bucket.pp=profile


story.expiry-seconds=${STORY_EXPIRY_SECONDS}
story.presign-seconds=${STORY_PRESIGN_SECONDS}

spring.jackson.date-format=dd-MM-yyyy

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# Virtual cards: numbers are looked up by HMAC with this key and never stored (PanService).
card.pan-hmac-key=${CARD_PAN_HMAC_KEY}
card.issuer-bin=${CARD_ISSUER_BIN:400000}

# Fees in percent; amounts round half-even to 2 decimals (FeeProperties).
paygenix.fees.commission-percent=${FEE_COMMISSION_PERCENT:2.00}
paygenix.fees.cashback-percent=${FEE_CASHBACK_PERCENT:0.5}
