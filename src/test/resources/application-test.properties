# Hermetic test config: dummy values so tests never depend on a local .env.
# Datasource and Redis come from Testcontainers (@ServiceConnection).
APP_NAME=Paygenix
APP_BASE_URL=http://localhost:8000
APP_WEB_URL=http://localhost:3000
DB_URL=jdbc:postgresql://unused:5432/unused
DB_USERNAME=unused
DB_PASSWORD=unused
MAIL_HOST=localhost
MAIL_PORT=2525
MAIL_USERNAME=test@example.test
MAIL_PASSWORD=unused
MAIL_PROTOCOL=smtp
MAIL_SMTP_AUTH=false
MAIL_STARTTLS_ENABLE=false
JWT_SECRET=test-only-jwt-secret-not-used-anywhere-else-0123456789abcdef
JWT_EXPIRATION=900
JWT_REFRESH_EXPIRATION=604800
GOOGLE_CLIENT_ID=test-client-id
GOOGLE_CLIENT_SECRET=test-client-secret
GOOGLE_REDIRECT_URI=http://localhost:8000/login/oauth2/code/google
MINIO_URL=http://localhost:9000
MINIO_ACCESS_KEY=unused
MINIO_SECRET_KEY=unused-secret
STORY_EXPIRY_SECONDS=86400
STORY_PRESIGN_SECONDS=600
CARD_PAN_HMAC_KEY=test-only-card-hmac-key-0123456789abcdef
SWAGGER_ENABLED=false
CORS_ALLOWED_ORIGINS=http://localhost:3000
# set explicitly: a developer's .env (spring.config.import) must not change what tests expect
REFRESH_COOKIE_SECURE=true
