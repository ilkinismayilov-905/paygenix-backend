services:
  postgres-db:
    image: postgres:15-alpine
    container_name: paygenix-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: paygenix-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # 3. Java Spring Boot App
  paygenix-app:
    build: .
    container_name: paygenix-api
    restart: always
    depends_on:
      - postgres-db
      - redis
    ports:
      - "${SERVER_PORT:-8000}:8000"
    # Bu hissə vacibdir: .env faylındakı bütün dataları Java-ya ötürür
    env_file:
      - .env
    environment:
      # YAML daxili linkləri bura yazırıq ki, application.properties bunları tanısın
      - DB_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME}
      - REDIS_HOST=redis
      - APP_BASE_URL=${APP_BASE_URL}

volumes:
  pgdata: