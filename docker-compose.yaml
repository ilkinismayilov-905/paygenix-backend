services:
  postgres-db:
    image: postgres:15-alpine
    container_name: paygenix-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: paygenix-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # S3-compatible storage for promo stories, profile photos and identity documents (MINIO_* settings; the app uses
  # the MinIO client, which speaks plain S3). SeaweedFS replaces the MinIO image, which is no longer published.
  # Local and E2E: `docker compose --profile local up -d storage storage-init`; on a single server: profile
  # `storage` (docs/DEPLOY.md). MINIO_URL must be reachable by the app and by browsers (presigned links).
  storage:
    image: chrislusf/seaweedfs:3.97
    container_name: paygenix-storage
    profiles: ["local", "e2e", "storage"]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
    # one identity with the app's keys, written at start so the keys stay out of the repository
    entrypoint: ["sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"paygenix","credentials":[{"accessKey":"%s","secretKey":"%s"}],
        "actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=256 -volume.max=16
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3data:/data

  # creates the buckets the app expects through the S3 API itself (works against any S3 store); 409 = exists already
  storage-init:
    image: curlimages/curl:8.15.0
    profiles: ["local", "e2e", "storage"]
    depends_on:
      - storage
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 90); do curl -s -o /dev/null --max-time 2 http://storage:8333/ && break; sleep 1; done;
        for b in stories profile kyc; do
        code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --aws-sigv4 'aws:amz:us-east-1:s3'
        --user "$$S3_ACCESS_KEY:$$S3_SECRET_KEY" -X PUT "http://storage:8333/$$b");
        echo "bucket $$b: $$code"; case "$$code" in 200|409) ;; *) exit 1 ;; esac; done

  # SMTP catcher for local runs and the E2E suite: MAIL_HOST=localhost MAIL_PORT=1025 MAIL_SMTP_AUTH=false
  # MAIL_STARTTLS_ENABLE=false; read the mail at http://127.0.0.1:8025 (the E2E suite reads codes from its API)
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: paygenix-mailpit
    profiles: ["local", "e2e"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # 3. Java Spring Boot App
  paygenix-app:
    build: .
    container_name: paygenix-api
    restart: always
    depends_on:
      - postgres-db
      - redis
    ports:
      # host-only: clients reach the app through nginx; a direct client must not be able to pose as a proxy (T-076)
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    # Bu hissə vacibdir: .env faylındakı bütün dataları Java-ya ötürür
    env_file:
      - .env
    environment:
      # YAML daxili linkləri bura yazırıq ki, application.properties bunları tanısın
      - DB_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME}
      - REDIS_HOST=redis
      # REDIS_PORT in .env is the host port; inside the network Redis listens on 6379
      - REDIS_PORT=6379
      - APP_BASE_URL=${APP_BASE_URL}
      # only the web container (fixed address below) may set X-Forwarded-* (T-076)
      - TRUSTED_PROXIES=172[.]28[.]0[.]10
      # actuator (health, Prometheus metrics): reachable on the compose network only, never published
      - MANAGEMENT_PORT=8081
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # 4. Web: the frontend build plus the same-origin /api proxy (frontend/Dockerfile). Put TLS in front of it.
  paygenix-web:
    build: ./frontend
    container_name: paygenix-web
    restart: always
    depends_on:
      paygenix-app:
        condition: service_healthy
    environment:
      BACKEND_URL: http://paygenix-app:8000
      # origin of presigned storage links when it is not https (e.g. http://localhost:9000), for the CSP
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:-}
      # the TLS edge below: the only address whose X-Forwarded-For / -Proto nginx believes
      EDGE_PROXY: 172.28.0.11
    ports:
      # with the TLS edge, publish this on loopback only: WEB_PORT=127.0.0.1:8080
      - "${WEB_PORT:-80}:80"
    networks:
      default:
        ipv4_address: 172.28.0.10

  # TLS edge (T-146): `docker compose --profile tls up -d` with APP_DOMAIN, MEDIA_DOMAIN and ACME_EMAIL set; Caddy
  # gets the certificates itself (it does not start without them). Runbook: docs/DEPLOY.md.
  caddy:
    image: caddy:2.10.2-alpine
    container_name: paygenix-caddy
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - paygenix-web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      default:
        ipv4_address: 172.28.0.11

  # Metrics (M9): `docker compose --profile monitoring up -d prometheus`, then http://127.0.0.1:9090 on the server
  # (an SSH tunnel from elsewhere). Scrapes the API's management port over the compose network.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: paygenix-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  s3data:
  caddydata:
  caddyconfig:
  promdata: