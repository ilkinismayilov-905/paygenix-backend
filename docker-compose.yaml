services:
  postgres-db:
    image: postgres:15-alpine
    container_name: paygenix-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: paygenix-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    # shortcut: minio/minio is no longer pullable from Docker Hub; this digest (RELEASE.2025-09-07T16-13-09Z) only works where it is cached. Pick a maintained image or S3-compatible store before CI/deploy.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: paygenix-minio
    # local dev only (app runs on the host): `docker compose --profile local up -d` / `--profile local down`
    profiles: ["local"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  # 3. Java Spring Boot App
  paygenix-app:
    build: .
    container_name: paygenix-api
    restart: always
    depends_on:
      - postgres-db
      - redis
    ports:
      - "${SERVER_PORT:-8000}:8000"
    # Bu hissə vacibdir: .env faylındakı bütün dataları Java-ya ötürür
    env_file:
      - .env
    environment:
      # YAML daxili linkləri bura yazırıq ki, application.properties bunları tanısın
      - DB_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME}
      - REDIS_HOST=redis
      - APP_BASE_URL=${APP_BASE_URL}

volumes:
  pgdata:
  miniodata: