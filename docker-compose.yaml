services:
  postgres-db:
    image: postgres:15-alpine
    container_name: paygenix-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: paygenix-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    # shortcut: minio/minio is no longer pullable from Docker Hub; this digest (RELEASE.2025-09-07T16-13-09Z) only works where it is cached. Pick a maintained image or S3-compatible store before CI/deploy.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: paygenix-minio
    # local dev only (app runs on the host): `docker compose --profile local up -d` / `--profile local down`
    profiles: ["local"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  # 3. Java Spring Boot App
  paygenix-app:
    build: .
    container_name: paygenix-api
    restart: always
    depends_on:
      - postgres-db
      - redis
    ports:
      # host-only: clients reach the app through nginx; a direct client must not be able to pose as a proxy (T-076)
      - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    # Bu hissə vacibdir: .env faylındakı bütün dataları Java-ya ötürür
    env_file:
      - .env
    environment:
      # YAML daxili linkləri bura yazırıq ki, application.properties bunları tanısın
      - DB_URL=jdbc:postgresql://postgres-db:5432/${DB_NAME}
      - REDIS_HOST=redis
      # REDIS_PORT in .env is the host port; inside the network Redis listens on 6379
      - REDIS_PORT=6379
      - APP_BASE_URL=${APP_BASE_URL}
      # only the web container (fixed address below) may set X-Forwarded-* (T-076)
      - TRUSTED_PROXIES=172[.]28[.]0[.]10

  # 4. Web: the frontend build plus the same-origin /api proxy (frontend/Dockerfile). Put TLS in front of it.
  paygenix-web:
    build: ./frontend
    container_name: paygenix-web
    restart: always
    depends_on:
      - paygenix-app
    environment:
      BACKEND_URL: http://paygenix-app:8000
      # origin of presigned storage links when it is not https (e.g. http://localhost:9000), for the CSP
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:-}
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      default:
        ipv4_address: 172.28.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  miniodata: